<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>汽车产业链企业数据库（内部版）</title>
<style>
:root{--red:#8A1F1F;--dark:#2B2B2B;--grey:#595959;--line:#E8E0E0;--bg:#FAF7F5;--gold:#C8963E;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:"PingFang SC","Noto Sans SC",sans-serif;background:var(--bg);color:var(--dark);padding-bottom:48px;}
mark{background:#F5D9A8;color:inherit;border-radius:2px;padding:0 1px;}
header{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#8A1F1F,#701818);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 12px;box-shadow:0 2px 10px rgba(0,0,0,.15);}
header h1{font-size:19px;letter-spacing:1px;display:flex;align-items:baseline;gap:8px;}
.badge{font-size:10.5px;background:#C8963E;color:#fff;border-radius:4px;padding:2px 6px;letter-spacing:1px;}
header .sub{font-size:11.5px;opacity:.8;margin-top:4px;}
.searchbar{margin-top:10px;display:flex;gap:8px;}
.searchbar input{flex:1;border:none;border-radius:8px;padding:9px 12px;font-size:15px;outline:none;}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 6px;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex:none;border:1px solid var(--red);color:var(--red);background:#fff;border-radius:999px;padding:5px 13px;font-size:13px;white-space:nowrap;}
.chip.on{background:var(--red);color:#fff;}
.meta{padding:4px 16px 8px;font-size:12px;color:var(--grey);}
.card{background:#fff;margin:10px 12px;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.card .hd{display:flex;align-items:flex-start;gap:6px;padding:13px 14px 8px;}
.star{flex:none;font-size:19px;color:#D8CFCB;line-height:1.1;padding:0 2px;}
.star.fav{color:var(--gold);}
.card .nm{font-size:16.5px;font-weight:700;}
.card .rdtag{flex:none;font-size:10px;color:#A9A0A0;border:1px solid #D9D2D2;border-radius:4px;padding:1px 5px;margin-top:3px;}
.card .rdtag.hide{display:none;}
.ntdot{flex:none;font-size:10px;color:var(--gold);margin-top:3px;}
.ntdot.hide{display:none;}
.card .tags{display:flex;flex-wrap:wrap;gap:5px;margin-left:auto;flex:none;padding-top:1px;}
.tag{font-size:11px;border-radius:4px;padding:2px 7px;white-space:nowrap;}
.tag.t{background:#F5E9E9;color:var(--red);border:1px solid #E3CBCB;}
.tag.s{background:#F0F0F0;color:var(--grey);}
.tag.s.listed{background:#1F5C3D;color:#fff;}
.pitch{padding:0 14px 8px;font-size:13.5px;line-height:1.7;color:#444;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card.open .pitch{-webkit-line-clamp:unset;}
.more{display:none;border-top:1px dashed var(--line);padding:10px 14px 4px;font-size:13px;color:#555;}
.card.open .more{display:block;}
.more .row{display:flex;gap:8px;padding:3px 0;line-height:1.6;}
.more .k{flex:none;color:var(--grey);width:64px;}
.card .readbtn{display:none;margin:6px 14px 13px;text-align:center;background:var(--red);color:#fff;font-size:14px;letter-spacing:2px;padding:10px 0;border-radius:8px;box-shadow:0 2px 6px rgba(138,31,31,.25);}
.card.open .readbtn{display:block;}
.card .ft{display:flex;align-items:center;justify-content:flex-end;padding:0 14px 10px;color:#B0A6A6;font-size:12.5px;}
.card .ft::after{content:"展开 ▾";letter-spacing:1px;}
.card.open .ft{display:none;}
.empty{text-align:center;color:var(--grey);padding:60px 0;font-size:14px;display:none;}
#reader{position:fixed;inset:0;background:#fff;z-index:100;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;}
#reader.show{display:block;}
.rbar{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#8A1F1F,#701818);color:#fff;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;flex-wrap:wrap;}
.rbar .rrow1{display:flex;align-items:center;gap:10px;}
.rbar .rrow2{display:flex;gap:12px;margin-top:11px;}
.rbar .back{flex:none;border:1px solid rgba(255,255,255,.6);border-radius:8px;background:transparent;color:#fff;font-size:13.5px;padding:6px 11px;}
.rbar .mini{flex:1;border:1px solid rgba(255,255,255,.5);border-radius:10px;background:rgba(255,255,255,.06);color:#fff;font-size:13.5px;padding:11px 0;letter-spacing:2px;white-space:nowrap;}
.rbar .mini.on{background:#C8963E;border-color:#C8963E;color:#fff;}
.rbar .rt{min-width:0;flex:1;}
.rbar .rt b{font-size:16.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rbar .rt span{font-size:11.5px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
.rbody{padding:16px 16px 40px;max-width:760px;margin:0 auto;font-size:15px;line-height:1.85;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
.rbody .intro{font-size:12.5px;color:var(--grey);border-left:3px solid var(--red);padding:6px 10px;background:#FBF6F6;border-radius:0 6px 6px 0;margin-bottom:14px;line-height:1.7;}
.rbody h2{font-size:17.5px;color:var(--red);border-bottom:2px solid var(--red);padding-bottom:5px;margin:22px 0 10px;letter-spacing:.5px;}
.rbody p{margin:8px 0;}
.rbody .bl{padding-left:16px;position:relative;margin:6px 0;}
.rbody .bl::before{content:"";position:absolute;left:2px;top:11px;width:6px;height:6px;border-radius:50%;background:var(--red);}
.rbody .nt{font-size:11.5px;color:var(--grey);font-style:italic;margin:6px 0 12px;}
.tbw{overflow-x:auto;margin:10px 0;}
table.tb{border-collapse:collapse;width:100%;min-width:560px;font-size:13px;line-height:1.6;}
table.tb th{background:var(--red);color:#fff;font-weight:700;padding:7px 9px;text-align:left;border:1px solid #B98A8A;font-size:12.5px;}
table.tb td{padding:7px 9px;border:1px solid #DDD3D3;vertical-align:top;}
table.tb tr:nth-child(even) td{background:#FBF8F8;}
.notesec{max-width:760px;margin:0 auto;padding:0 16px 50px;}
.notesec .nh{font-size:14px;color:var(--red);font-weight:700;margin:6px 0 8px;}
.stars{font-size:26px;letter-spacing:6px;color:#D8CFCB;margin-bottom:8px;}
.stars .on{color:var(--gold);}
.notesec textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:14px;font-family:inherit;resize:vertical;outline:none;background:#FFFDFC;}
.nsave{font-size:11.5px;color:var(--grey);margin-top:4px;}
#chg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:flex-end;}
#chg.show{display:flex;}
.chgbox{background:#fff;width:100%;max-height:70vh;border-radius:14px 14px 0 0;padding:16px 18px calc(16px + env(safe-area-inset-bottom));overflow-y:auto;}
.chgbox h3{font-size:15.5px;color:var(--red);margin-bottom:10px;}
.chgbox .ci{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px;line-height:1.65;}
.chgbox .cd{flex:none;color:var(--grey);font-size:12px;width:88px;}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:rgba(43,43,43,.92);color:#fff;font-size:13px;padding:9px 16px;border-radius:8px;z-index:300;display:none;}
footer{text-align:center;font-size:11px;color:#999;padding:14px 16px;line-height:2;}
footer .flink{color:var(--red);font-size:12px;letter-spacing:1px;}
@media print{
  body>*{display:none!important;}
  #reader{display:block!important;position:static!important;overflow:visible!important;}
  .rbar{display:none!important;}
  .rbody{padding:0;}
}
</style>
</head>
<body>
<header>
  <h1>汽车产业链企业数据库<span class="badge" style="display:inline-block">内部版</span></h1>
  <div class="sub">数据截至 2026-10 · 最近更新 <span id="upd"></span> · 共 <span id="total"></span> 家 · 点卡片展开概览，点 ☆ 收藏</div>
  <div class="searchbar"><input id="q" type="search" placeholder="搜索公司 / 赛道 / 关键词" oninput="render()"></div>
</header>
<div class="chips" id="chips"></div>
<div class="meta" id="cnt"></div>
<div id="list"></div>
<div class="empty" id="empty">没有匹配的公司</div>
<footer>
  <div><span class="flink" onclick="document.getElementById('chg').classList.add('show')">查看更新记录</span></div>
  <div>每篇含八个章节完整内容 · 收藏与备注仅保存在本机浏览器</div>
</footer>
<div id="chg"><div class="chgbox" onclick="event.stopPropagation()"><h3>更新记录</h3><div id="chglist"></div><div style="text-align:center;margin-top:12px"><span class="flink" onclick="document.getElementById('chg').classList.remove('show')">关闭</span></div></div></div>
<div class="toast" id="toast"></div>
<div id="reader">
  <div class="rbar">
    <div class="rrow1">
      <button class="back" onclick="closeReader()">‹ 返回</button>
      <div class="rt"><b id="rname"></b><span id="rsub"></span></div>
    </div>
    <div class="rrow2">
      <button class="mini" id="rfav" onclick="tgFavR()">☆ 收藏</button>
      <button class="mini" onclick="copySum()">复制摘要</button>
      <button class="mini" onclick="window.print()">导出PDF</button>
    </div>
  </div>
  <div class="rbody" id="rbody"></div>
  <div class="notesec">
  <div class="nh">内部备注（仅保存在本机浏览器）</div>
  <div class="stars" id="ratestars" style="display:flex;gap:2px;cursor:pointer"><span onclick="setRate(CUR.name,1)">★</span><span onclick="setRate(CUR.name,2)">★</span><span onclick="setRate(CUR.name,3)">★</span><span onclick="setRate(CUR.name,4)">★</span><span onclick="setRate(CUR.name,5)">★</span></div>
  <textarea id="note" placeholder="记录尽调线索、联系人、判断…" oninput="saveNote(CUR.name,this.value)"></textarea>
  <div class="nsave" id="nsave">点击星标评分，备注自动保存</div>
</div>
</div>
<script src="data.js"></script>
<script>
const DATA=window.RDB_DATA;
document.getElementById('upd').textContent=window.RDB_UPDATED;
document.getElementById('total').textContent=window.RDB_TOTAL;
document.getElementById('chglist').innerHTML=window.RDB_CHANGELOG.map(c=>`<div class="ci"><span class="cd">${c.d}</span><span>${c.t}</span></div>`).join('');
const INTERNAL=true;
const LS={fav:'rdb_fav_v1',read:'rdb_read_v1',notes:'rdb_notes_v1',rate:'rdb_rate_v1'};
function ld(k){try{return JSON.parse(localStorage.getItem(k))||{}}catch(e){return{}}}
function sv(k,v){localStorage.setItem(k,JSON.stringify(v))}
let FAV=ld(LS.fav),READ=ld(LS.read),NOTES=ld(LS.notes),RATES=ld(LS.rate);
const tracks=['全部','★ 收藏',...new Set(DATA.map(d=>d.track))];
let cur='全部';
const chips=document.getElementById('chips');
tracks.forEach(t=>{const b=document.createElement('button');b.className='chip'+(t==='全部'?' on':'');b.textContent=t;b.onclick=()=>{cur=t;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.textContent===t));render();};chips.appendChild(b);});
const listed=new Set(['已上市 02431.HK','已上市 00600.HK','已上市','拟上市','Pre-IPO','递表失效']);
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hi(s,q){const e=esc(s);if(!q)return e;const eq=esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return e.replace(new RegExp('('+eq+')','gi'),'<mark>$1</mark>');}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',1600);}
function render(){
  const q=document.getElementById('q').value.trim();
  const ql=q.toLowerCase();
  const list=document.getElementById('list');list.innerHTML='';
  const rows=DATA.filter(d=>{
    if(cur==='★ 收藏'&&!FAV[d.name])return false;
    if(cur!=='全部'&&cur!=='★ 收藏'&&d.track!==cur)return false;
    return !q||(d.name+d.track+d.pitch+d.status+(d.lastfin||'')+(d.val||'')+(d.rev||'')).toLowerCase().includes(ql);
  });
  document.getElementById('cnt').textContent=`${cur} · ${rows.length} / ${DATA.length} 家`;
  document.getElementById('empty').style.display=rows.length?'none':'block';
  rows.forEach(d=>{
    const c=document.createElement('div');c.className='card';
    c.innerHTML=`<div class="hd"><span class="star ${FAV[d.name]?'fav':''}" onclick="event.stopPropagation();togFav('${d.name}',this)">${FAV[d.name]?'★':'☆'}</span>
      <div class="nm" onclick="event.stopPropagation();openReader('${d.name}')">${hi(d.name,q)}</div>
      <span class="rdtag ${READ[d.name]?'':'hide'}">已读</span>
      ${INTERNAL?`<span class="ntdot ${NOTES[d.name]?'':'hide'}">●备注</span>`:''}
      <div class="tags"><span class="tag t">${hi(d.track,q)}</span><span class="tag s${listed.has(d.status)?' listed':''}">${esc(d.status)}</span></div></div>
      <div class="pitch">${hi(d.pitch,q)}</div>
      <div class="more">
        <div class="row"><span class="k">成立时间</span><span>${esc(d.founded)||'—'}</span></div>
        <div class="row"><span class="k">注册资本</span><span>${esc(d.capital)||'—'}</span></div>
        <div class="row"><span class="k">注册地</span><span>${esc(d.location)||'—'}</span></div>
        <div class="row"><span class="k">最近融资</span><span>${hi(d.lastfin||'未披露',q)}</span></div>
        <div class="row"><span class="k">估值</span><span>${hi(d.val||'未披露',q)}</span></div>
        <div class="row"><span class="k">收入</span><span>${hi(d.rev||'未披露',q)}</span></div>
      </div>
      <div class="readbtn" onclick="event.stopPropagation();openReader('${d.name}')">阅读完整报告</div>
      <div class="ft"></div>`;
    c.onclick=()=>c.classList.toggle('open');
    list.appendChild(c);
  });
}
function syncFavBtn(){const b=document.getElementById('rfav');if(!b||!CUR)return;b.textContent=FAV[CUR.name]?'★ 已收藏':'☆ 收藏';b.classList.toggle('on',!!FAV[CUR.name]);}
function tgFavR(){if(!CUR)return;if(FAV[CUR.name])delete FAV[CUR.name];else FAV[CUR.name]=1;sv(LS.fav,FAV);syncFavBtn();render();toast(FAV[CUR.name]?'已收藏':'已取消收藏');}
function togFav(n,el){if(FAV[n])delete FAV[n];else FAV[n]=1;sv(LS.fav,FAV);el.textContent=FAV[n]?'★':'☆';el.classList.toggle('fav',!!FAV[n]);if(cur==='★ 收藏')render();}
function blocksHtml(d){
  let h='';
  if(d.intro){
    const m=d.intro.match(/信息截至\s*(\d{4}\s*年\s*\d+\s*月)/);
    h+=`<div class="intro">数据说明：信息截至 ${m?m[1].replace(/\s+/g,' '):'2026 年 10 月'}。</div>`;
  }
  d.blocks.forEach(b=>{
    if(b.t==='h') h+=`<h2>${esc(b.x)}</h2>`;
    else if(b.t==='b') h+=`<p class="bl">${esc(b.x)}</p>`;
    else if(b.t==='n') h+=`<p class="nt">${esc(b.x)}</p>`;
    else if(b.t==='tb'){
      h+='<div class="tbw"><table class="tb"><tr>'+b.r[0].map(c=>`<th>${esc(c)}</th>`).join('')+'</tr>';
      for(let i=1;i<b.r.length;i++) h+='<tr>'+b.r[i].map(c=>`<td>${esc(c)}</td>`).join('')+'</tr>';
      h+='</table></div>';
    }
    else h+=`<p>${esc(b.x)}</p>`;
  });
  return h;
}
let CUR=null;
function openReader(name){
  const d=DATA.find(x=>x.name===name); if(!d) return; CUR=d;
  READ[d.name]=1;sv(LS.read,READ);
  syncFavBtn();
  document.getElementById('rname').textContent=d.name;
  document.getElementById('rsub').textContent=`${d.track} · ${d.status} · 完整报告`;
  document.getElementById('rbody').innerHTML=blocksHtml(d);
  if(INTERNAL)loadNotes(d.name);
  document.getElementById('reader').classList.add('show');
  document.getElementById('reader').scrollTop=0;
  document.body.style.overflow='hidden';
  render();
}
function closeReader(){
  document.getElementById('reader').classList.remove('show');
  document.body.style.overflow='';
}
function copySum(){
  if(!CUR)return;
  const d=CUR;
  const t=`${d.name}｜${d.track}｜${d.status}\n定位：${d.pitch}\n成立时间：${d.founded||'—'}\n最近融资：${d.lastfin||'未披露'}\n估值：${d.val||'未披露'}\n收入：${d.rev||'未披露'}`;
  const done=()=>toast('摘要已复制');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(()=>{prompt('复制以下摘要：',t);});}
  else{prompt('复制以下摘要：',t);}
}
function loadNotes(n){
  const r=RATES[n]||0;
  document.querySelectorAll('#ratestars span').forEach((s,i)=>s.classList.toggle('on',i<r));
  document.getElementById('note').value=NOTES[n]||'';
}
function setRate(n,v){RATES[n]=v;sv(LS.rate,RATES);loadNotes(n);toast('已评分 '+v+' 星');render();}
function saveNote(n,v){NOTES[n]=v;sv(LS.notes,NOTES);document.getElementById('nsave').textContent='已自动保存 '+(v?('（'+v.length+' 字）'):'');render();}
document.getElementById('chg').addEventListener('click',()=>document.getElementById('chg').classList.remove('show'));
render();
</script>
</body>
</html>
